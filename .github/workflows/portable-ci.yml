name: Portable CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint portable consolidation scope
        run: python -m ruff check --select E,F,I,UP src/market_strats/intelligence tests/test_mi*.py

      - name: Run portable tests
        run: python -m pytest -q -m "not artifact"
