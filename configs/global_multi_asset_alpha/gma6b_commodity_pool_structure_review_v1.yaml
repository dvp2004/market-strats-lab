    vehicle_structure: Commodity pool organized as a limited partnership and exchange-traded fund issuing shares on NYSE Arca; managed by United States Commodity Funds LLC as commodity pool operator.
    stated_investment_objective: Daily percentage changes in per-share NAV are intended to reflect daily percentage changes in the spot price of light sweet crude oil delivered to Cushing, Oklahoma, as measured by the Benchmark Oil Futures Contract, plus collateral interest, less expenses.
    primary_exposure_instruments: Short-term exchange-traded light sweet crude oil futures contracts, with possible oil-related investments including swaps, forwards, and options when required by regulation, liquidity, risk management, or market conditions.
    roll_or_contract_management_description: Benchmark exposure changes from the near-month NYMEX futures contract to the next-month contract over an approximately five-day roll period at the beginning of each month.
    collateral_or_cash_description: Collateral holdings include cash, cash equivalents, and United States government obligations; collateral interest is part of the stated NAV objective.
    distribution_and_corporate_action_note: Adjusted-price history may include distributions, expenses, collateral interest, and corporate-action effects such as splits; these remain embedded in traded-instrument return.
    adjusted_price_interpretation: GMA-6 treats adjusted-price performance as realised traded USO ETP return, not as a spot crude oil return series; no additional synthetic roll-cost deduction is applied unless a future separate contract changes that assumption.
    economic_exposure_label: futures_linked_oil_etp_return_exposure
    spot_proxy_claim_permitted: false
    traded_etp_total_return_interpretation: true
