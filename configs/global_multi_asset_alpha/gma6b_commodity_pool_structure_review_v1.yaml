    vehicle_structure: Commodity pool with Invesco Capital Management LLC serving as managing owner, commodity pool operator, and commodity trading advisor; shares trade on NYSE Arca.
    stated_investment_objective: The fund seeks to track, over time, the performance of the DBIQ Diversified Agriculture Index Excess Return, intended to reflect changes in value of the agriculture sector.
    primary_exposure_instruments: Exchange-traded futures contracts on agricultural commodities including corn, soybeans, soybean meal, soybean oil, wheat, Kansas City wheat, sugar, cocoa, coffee, cotton, live cattle, feeder cattle, and lean hogs.
