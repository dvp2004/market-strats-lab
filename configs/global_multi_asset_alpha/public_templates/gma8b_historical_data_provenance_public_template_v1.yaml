# =============================================================================
# PUBLIC NON-RUNNABLE TEMPLATE — GMA-8B Historical Data Provenance V1
# =============================================================================
#
# PURPOSE
#   This file is a public configuration schema template illustrating the
#   structure required to run GMA-8B on a local machine.
#   It is NOT the frozen local evidence contract and CANNOT be executed as-is.
#
# WHY THIS FILE EXISTS
#   The frozen local contract
#   (configs/global_multi_asset_alpha/gma8b_historical_data_provenance_contract_v1.yaml)
#   is NOT published because it contains machine-specific absolute Windows paths
#   to private GMA-6 immutable evidence that is not included in this repository.
#
# HOW TO USE
#   Replace every REQUIRED_PRIVATE_* placeholder with the exact absolute path
#   on the operator's machine, and supply the matching SHA-256 hash values.
#   The GMA-8B source module (gma8b_historical_data_provenance.py) will fail
#   closed with an explicit error if any required private input is absent or
#   its hash does not match.
#
# IMPORTANT
#   - Do not submit this template as a real contract.
#   - Do not invent, guess, or substitute paths.
#   - Do not include credentials, tokens, or account information.
#   - GMA-8B results remain observed development evidence, not a pristine
#     final holdout. No execution or promotion decision is produced.
# =============================================================================

contract:
  contract_id: gma8b_historical_data_provenance_contract_v1
  contract_version: v1
  source_commit: 86a49fc3cc589ea9b2835423524e33e5fb8cc208
  purpose: deterministic immutable 29-series adjusted-price provenance and readiness audit
  adjusted_price_interpretation: historical_total_return_adjusted_price_evidence_under_inherited_convention
  real_time_vendor_publication_timing_verified: false
  public_template: true
  runnable: false
  requires_private_evidence: true

gma8a_parent:
  # These paths are relative to the GMA-8 worktree root and are portable.
  config_path: configs/global_multi_asset_alpha/gma8a_broad_multi_asset_tournament_contract_v1.yaml
  universe_registry_path: reports/global_multi_asset_alpha/gma8a_broad_multi_asset_tournament_v1/gma8a_universe_arm_registry_v1.csv
  strategy_grid_registry_path: reports/global_multi_asset_alpha/gma8a_broad_multi_asset_tournament_v1/gma8a_strategy_grid_registry_v1.csv
  lock_path: reports/global_multi_asset_alpha/gma8a_broad_multi_asset_tournament_v1/gma8a_lock_v1.json
  execution_manifest_path: reports/global_multi_asset_alpha/gma8a_broad_multi_asset_tournament_v1/gma8a_execution_manifest_v1.json
  expected_lock_sha256: 12b0abffa49095bdc02b5c062c36b5413a94c68e229b552ed30145a1af7b5ee8
  expected_base_strategy_template_count: 80
  expected_arm_trial_count: 160
  expected_strategy_grid_hash: 513139855cb34a67f735170683dd548724574001d43b7e3c4e29c32ecead5f6a

frozen_metadata_roots:
  # ---------------------------------------------------------------------------
  # REQUIRED PRIVATE INPUTS — replace each placeholder with an exact local path
  # ---------------------------------------------------------------------------
  #
  # immutable_snapshot_root  : absolute path to the root directory of the
  #                            immutable GMA-6 V1 evidence snapshot on the
  #                            operator's machine.
  immutable_snapshot_root: REQUIRED_PRIVATE_EVIDENCE_ROOT
  #
  # snapshot_manifest_path   : absolute path to the GMA-6 V1 evidence snapshot
  #                            manifest CSV file inside the snapshot root.
  snapshot_manifest_path: REQUIRED_PRIVATE_SOURCE_MANIFEST
  #
  # normalised_inventory_path: absolute path to the GMA-6B normalised file
  #                            hash inventory CSV (gma6b_normalised_file_hashes_v1.csv).
  normalised_inventory_path: REQUIRED_PRIVATE_EVIDENCE_PATH
  #
  # The SHA-256 hash below is a frozen protocol constant, not a path.
  # It must not be changed; it identifies the exact immutable snapshot manifest.
  snapshot_manifest_sha256: e767cb622bfe41240a8a4536920f79def3d267092b1bd0dcb2e6a06865ecdc6a
  gma6b_bundle_config_relative_path: configs/global_multi_asset_alpha/gma6b_expanded_etf_data_bundle_v1.yaml
  gma6b_bundle_manifest_relative_path: reports/global_multi_asset_alpha/gma6b_expanded_etf_data_bundle_v1/gma6b_data_bundle_manifest_v1.json

frozen_lineage:
  # These are frozen protocol integrity hashes — not credentials or local paths.
  gma6_snapshot_manifest_hash: e767cb622bfe41240a8a4536920f79def3d267092b1bd0dcb2e6a06865ecdc6a
  gma6b_data_bundle_manifest_hash: b93bd9800ddfffa19f12100c4538a4668ae61c20b7e322fec8df9441f63a166b
  normalised_bundle_hash: 3d3d920e9bafa430fb313fe0f494954826a73f8962a15eb8709d02f2bae14bb6

resolution_contract:
  inventory_ticker_field: ticker
  inventory_hash_field: normalised_series_file_hash
  manifest_hash_field: snapshot_sha256
  manifest_data_path_field: snapshot_path
  manifest_provenance_only_path_field: source_path
  manifest_hash_match_field: hash_match
  exact_match_count_per_inventory_hash: 1
  use_source_path_as_data_source: false
  path_discovery_allowed: false
  candidate_path_guessing_allowed: false
  fallback_source_allowed: false

frozen_normalised_schema:
  provider_auto_adjust_required: false
  provider_actions_required: true
  session_date_field: date
  adjusted_price_field: adj_close
  exact_csv_columns: [date, open, high, low, close, adj_close, volume]
  schema_evidence: frozen_gma6b_provider_contract_and_exact_immutable_normalised_header

universe_arms:
  gma8_core_22_etf_v1: [SPY, QQQ, IWM, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, EFA, EEM, BIL, IEF, TLT, AGG, LQD, HYG, GLD, DBC]
  gma8_expanded_29_etp_v1: [SPY, QQQ, IWM, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, EFA, EEM, BIL, IEF, TLT, AGG, LQD, HYG, GLD, DBC, VNQ, TIP, USO, DBA, SLV, EWG, EWJ]

availability:
