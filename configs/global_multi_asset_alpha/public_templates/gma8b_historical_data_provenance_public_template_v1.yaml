  required_price_sessions_for_maximum_lookback_expected: 253
  unequal_start_comparison_status: not_comparable_due_to_effective_start
  instrument_drops_allowed: false
  fallback_arm_allowed: false

data_handling:
  adjusted_prices_only: true
  forward_fill_allowed: false
  backward_fill_allowed: false
  interpolation_allowed: false
  substitution_allowed: false
  row_removal_allowed: false
  backfill_allowed: false
  raw_price_copy_allowed: false

prohibited_operations:
  data_download_performed: false
  indicator_calculation_performed: false
  model_fit_performed: false
  backtest_performed: false
  strategy_ranking_performed: false
  portfolio_target_generated: false
  paper_broker_or_live_path_created: false
