  gma8_expanded_29_etp_v1:
    instrument_scope: exchange_traded_funds_and_products_only
    symbols: [SPY, QQQ, IWM, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, EFA, EEM, BIL, IEF, TLT, AGG, LQD, HYG, GLD, DBC, VNQ, TIP, USO, DBA, SLV, EWG, EWJ]
    symbol_metadata:
      USO: uso_roll_methodology_pre_may_2020_vs_from_may_2020
      DBA: historical_traded_commodity_pool_etp_interpretation

deferred_cohorts:
  - cohort_id: individual_us_equities_survivorship_free_v1
    blocked_until_separate_contract: true
    reason: point-in-time membership, delisting, corporate-action, and survivorship controls required
  - cohort_id: crypto_directional_24x7_v1
    blocked_until_separate_contract: true
    reason: separately locked 24/7 calendar, venue, liquidity, custody, and cost convention required
  - cohort_id: direct_futures_continuous_contracts_v1
    blocked_until_separate_contract: true
    reason: continuous-contract and roll methodology required
  - cohort_id: fx_directional_v1
    blocked_until_separate_contract: true
    reason: separately locked spot/forward, rollover, and trading-session convention required

