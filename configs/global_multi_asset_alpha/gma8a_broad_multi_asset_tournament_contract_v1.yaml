evaluation:
  development_and_selection_period: {start_date: "2007-05-30", end_date: "2020-12-31"}
  gma8_strategy_specific_outer_evaluation: {start_date: "2021-01-04", end_date: gma8b_frozen_data_endpoint}
  gma8b_endpoint_must_be_pinned_before_market_data_read: true
  outer_period_is_pristine_programme_wide_holdout: false
  outer_period_may_influence_strategy_or_universe_selection: false
  evaluation_scopes: [full_history, rolling_3_year, rolling_5_year, chronological_walk_forward, predefined_regime_windows]
  cost_scenarios: [baseline_1bps, stressed_10bps, stressed_25bps, severe_50bps]

benchmark_and_exposure:
  primary_active_return_comparator_by_arm:
    gma8_core_22_etf_v1: gma8_core_22_equal_weight_monthly_benchmark
    gma8_expanded_29_etp_v1: gma8_expanded_29_equal_weight_monthly_benchmark
  matched_benchmarks_include_BIL: true
  reference_benchmarks_only: [SPY, BIL]
  shorting: prohibited
  gross_exposure_maximum: 1.00
  risk_overlay_may_only_reduce_risky_exposure: true
  residual_weight_destination: BIL
  volatility_targeting_may_increase_gross_risky_exposure_above_1: false

regime_windows:
  - {regime_id: global_financial_crisis_2007_10_to_2009_03, start_date: "2007-10-01", end_date: "2009-03-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: post_gfc_recovery_2009_04_to_2012_12, start_date: "2009-04-01", end_date: "2012-12-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: taper_and_commodity_stress_2013_01_to_2015_12, start_date: "2013-01-01", end_date: "2015-12-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: late_cycle_and_trade_stress_2016_01_to_2019_12, start_date: "2016-01-01", end_date: "2019-12-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: covid_crash_and_recovery_2020_02_to_2021_03, start_date: "2020-02-01", end_date: "2021-03-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: inflation_rate_shock_2022_01_to_2023_12, start_date: "2022-01-01", end_date: "2023-12-31", tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}
  - {regime_id: recent_geopolitical_stress_2023_10_to_gma8b_frozen_endpoint, start_date: "2023-10-01", end_date: gma8b_frozen_endpoint, tuning_period: false, coverage_rule: clip_to_strategy_effective_start_and_label_partial}

leakage_controls:
  decision_after_session_close: true
  earliest_execution: next_tradable_session
  no_future_price_in_signal: true
  no_future_price_in_label_or_metric: true
  chronological_train_test_separation_required: true
  embargo_sessions: 20
  same_cost_assumption_for_all_comparisons: true
  same_data_snapshot_per_universe_arm: true

metrics:
  required: [gross_return, net_return, CAGR, Sharpe, Sortino, maximum_drawdown, Calmar, annualised_turnover, cost_drag, maximum_HHI, positive_fold_count, largest_fold_return_share, regime_window_results, largest_regime_return_share]

concentration_definitions:
  contribution_scope: positive_active_return_contributions_only
  largest_fold_return_share: maximum_positive_fold_active_return / sum_positive_fold_active_returns
  largest_regime_return_share: maximum_positive_regime_active_return / sum_positive_regime_active_returns
  zero_denominator_result: fail_gate

robustness_gates:
  - {gate_id: positive_net_active_return_vs_benchmark_at_stressed_10bps, definition: net active return versus matched arm equal-weight benchmark is positive at 10 bps, failure_rule: nonpositive_active_return_fails, status: preregistered_not_evaluated}
  - {gate_id: at_least_3_positive_chronological_test_folds, definition: at least three chronological test folds have positive net active return, failure_rule: fewer_than_3_fails, status: preregistered_not_evaluated}
  - {gate_id: largest_fold_return_share_lte_0_50, definition: positive-fold concentration share is at most 0.50, failure_rule: share_above_0.50_or_zero_denominator_fails, status: preregistered_not_evaluated}
  - {gate_id: maximum_drawdown_not_worse_than_benchmark_by_more_than_0_03, definition: maximum drawdown is no more than 0.03 worse than matched benchmark, failure_rule: excess_drawdown_above_0.03_fails, status: preregistered_not_evaluated}
  - {gate_id: no_single_regime_window_accounts_for_majority_of_total_active_return, definition: positive-regime concentration share is at most 0.50, failure_rule: share_above_0.50_or_zero_denominator_fails, status: preregistered_not_evaluated}
  - {gate_id: turnover_and_cost_drag_reported, definition: annualised turnover and cost drag are both reported, failure_rule: either_missing_fails, status: preregistered_not_evaluated}

design_execution_assertions:
  data_download_performed: false
  market_data_read: false
  indicator_calculation_performed: false
  model_fit_performed: false
  backtest_performed: false
  strategy_ranking_performed: false
  portfolio_target_generated: false
  paper_broker_or_live_path_created: false
