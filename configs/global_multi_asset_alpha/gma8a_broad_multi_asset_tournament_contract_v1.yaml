  active_scope: broad_etf_etp_strategy_tournament_v1
  programme_name: GMA-8 broad multi-asset multi-strategy historical tournament
  design_only: true
  result_evidence_scope: ETF/ETP strategies only
  result_scope_exclusions: [direct_commodity, crypto, stock_selection, direct_futures, FX]
  result_status: preregistered_not_run
  highest_historical_cagr_or_sharpe_alone_is_selection_rule: false
  execution_or_promotion_decision_produced: false

gma6_boundary:
  gma6_v1_classifications_remain_unchanged: true
  gma8_expanded_29_is_not_a_gma6_subset_or_rescue_search: true
  no_27_instrument_fallback_arm: true

universe_arms:
  gma8_core_22_etf_v1:
    instrument_scope: exchange_traded_funds_and_products_only
    symbols: [SPY, QQQ, IWM, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, EFA, EEM, BIL, IEF, TLT, AGG, LQD, HYG, GLD, DBC]
