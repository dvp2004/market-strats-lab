# MI-2F-C — Prospective Technical Signal-Family Scorecard Contract V1
#
# Design-only. Research-only. No portfolio influence.
# Applies only to snapshots created AFTER this contract is frozen.
# Must not evaluate historical MI-2 metric values or alter any model.
#
# Resolves the four unresolved prerequisites from MI-2F-A:
#   1. qualification_comparison_row_policy
#   2. forecast_family_pass_thresholds  (MAE and rank-IC)
#   3. portfolio_gate_mapping           (no-portfolio boundary)
#   4. ridge_to_portfolio_evidence_association (ridge-to-evidence chain)

phase_id: mi2f_c_technical_prospective_scorecard_contract_v1
contract_version: v1
design_only: true
research_only: true
portfolio_influence: 0
scorecard_status: not_started
embedded_performance_results: false
embedded_model_outputs: false
trading_decision_created: false
threshold_selected_using_historical_metric_values: false

