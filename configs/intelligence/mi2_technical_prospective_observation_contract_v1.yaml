phase_id: mi2f_b_technical_prospective_observation_contract_v1
contract_version: v1
design_only: true
research_only: true
portfolio_influence: 0
prospective_observation_status: not_started
embedded_performance_results: false
embedded_model_outputs: false
trading_decision_created: false

frozen_parent_contracts:
  mi2_registry:
    file_name: mi2_research_registry.yaml
    sha256: 145ee25e3e17d61f9980d85558a96ecd96d84a3cc92349e1e290a7e9509ea10d
  mi2e_signal_export:
